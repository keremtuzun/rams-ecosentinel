services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ecosentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ecosentinel
    volumes:
      - database:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosentinel"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://ecosentinel:${POSTGRES_PASSWORD}@db:5432/ecosentinel
      WEB_ORIGIN: http://localhost:3000
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
    volumes:
      - ./artifacts:/app/artifacts
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "ecosentinel.cli", "worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://ecosentinel:${POSTGRES_PASSWORD}@db:5432/ecosentinel
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  database:
