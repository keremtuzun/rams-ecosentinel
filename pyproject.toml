[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rams-ecosentinel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3", "torch>=2.6,<3", "rasterio>=1.4,<2", "shapely>=2,<3",
  "pyproj>=3.6,<4", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4",
  "scikit-learn>=1.6,<2", "pillow>=11,<13", "reportlab>=4,<6", "matplotlib>=3.9,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
onnx = ["onnxruntime==1.24.3"]
cds = ["cdsapi>=0.7", "xarray>=2025.1", "netcdf4>=1.7"]

[project.scripts]
ecosentinel = "ecosentinel.cli:main"

[tool.setuptools.packages.find]
include = ["ecosentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
